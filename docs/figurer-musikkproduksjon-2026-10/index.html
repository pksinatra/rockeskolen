<h1>Musikkproduksjon – figurer</h1>
<h2>Hva skjer egentlig i et musikkstudio? <span>node/294</span></h2><figure><div class="num">1</div><img src="../../images/musikkproduksjon/mp-lydkort.svg" alt="Lydkortet: inngang, forforsterker og A/D inn – D/A, nivå og utganger ut"><figcaption>Lydkortet tar imot signalet fra mikrofon eller instrument, forsterker det og gjør det digitalt. På vei ut gjøres det analogt igjen og sendes til høyttalere eller hodetelefoner.</figcaption><p class="meta"><b>Plassering:</b> Lydkortet – forbindelsen mellom studioet og datamaskinen · <b>Fil:</b> mp-lydkort.svg</p></figure><figure><div class="num">2</div><img src="../../images/musikkproduksjon/mp-studio.svg" alt="Studioet som signalvei: mikrofon, lydkort, DAW, lydkort, høyttalere"><figcaption>Et enkelt opptak: lyden går inn gjennom lydkortet, behandles i DAW-en og går ut gjennom det samme lydkortet. Et MIDI-keyboard kobles gjerne rett til datamaskinen.</figcaption><p class="meta"><b>Plassering:</b> Signalveien – nøkkelen til å forstå studioet · <b>Fil:</b> mp-studio.svg</p></figure><h2>Fra lydkilde til høyttaler <span>node/295</span></h2><figure><div class="num">3</div><img src="../../images/musikkproduksjon/mp-lyd.svg" alt="Frekvens og amplitude vist som lydbølger"><figcaption>Frekvensen er antall svingninger per sekund og henger sammen med tonehøyden. Amplituden er størrelsen på svingningene og henger sammen med hvor kraftig lyden er.</figcaption><p class="meta"><b>Plassering:</b> Hva er egentlig lyd? · <b>Fil:</b> mp-lyd.svg</p></figure><figure><div class="num">4</div><img src="../../images/musikkproduksjon/mp-sampling.svg" alt="Sampling: det analoge signalet måles med jevne mellomrom"><figcaption>Omformeren måler signalet med jevne mellomrom. Samplingsfrekvensen er antall målinger per sekund: ved 44,1 kHz måles signalet 44 100 ganger i sekundet.</figcaption><p class="meta"><b>Plassering:</b> Samplingsfrekvens – hvor ofte måler vi? · <b>Fil:</b> mp-sampling.svg</p></figure><figure><div class="num">5</div><img src="../../images/musikkproduksjon/mp-bitdybde.svg" alt="Bitdybde: få og mange mulige verdier for hver måling"><figcaption>Bitdybden avgjør hvor mange verdier hver måling kan få. Figuren bruker 3 og 5 bit for å gjøre trinnene synlige. 16 bit gir 65 536 verdier, 24 bit over 16 millioner.</figcaption><p class="meta"><b>Plassering:</b> Bitdybde – hvor nøyaktig måler vi? · <b>Fil:</b> mp-bitdybde.svg</p></figure><figure><div class="num">6</div><img src="../../images/musikkproduksjon/mp-reisen.svg" alt="Signalveien fra stemme til øre, og hvilken form signalet har underveis"><figcaption>Hele reisen fra stemme til øre. Underveis skifter signalet form: lydbølger i luften, analogt elektrisk signal, digitale tall – og tilbake igjen.</figcaption><p class="meta"><b>Plassering:</b> Fra digitale data tilbake til lyd (ved «Hele reisen kan dermed beskrives slik») · <b>Fil:</b> mp-reisen.svg</p></figure><figure><div class="num">7</div><img src="../../images/musikkproduksjon/mp-niva.svg" alt="Nivåmåler i dBFS og en bølgeform med og uten clipping"><figcaption>0 dBFS er det høyeste nivået en vanlig digital lydfil kan lagre. Går signalet over, klippes toppene og lyden kan forvrenges. Ved opptak er det lurt å ha god margin.</figcaption><p class="meta"><b>Plassering:</b> Signalnivå – når blir lyden for kraftig? · <b>Fil:</b> mp-niva.svg</p></figure><h2>Audio og MIDI – to forskjellige verdener <span>node/296</span></h2><figure><div class="num">8</div><img src="../../images/musikkproduksjon/mp-audio-midi.svg" alt="Samme frase som lydopptak (bølgeform) og som MIDI (pianorull)"><figcaption>Den samme frasen (C4 – E4 – G4 – C5) som lydopptak og som MIDI. Bølgeformen inneholder selve lyden. Pianorullen viser bare hvilke toner som spilles, når, hvor lenge og med hvilket anslag.</figcaption><p class="meta"><b>Plassering:</b> To måter å arbeide med musikk på · <b>Fil:</b> mp-audio-midi.svg</p></figure><figure><div class="num">9</div><img src="../../images/musikkproduksjon/mp-midi-vei.svg" alt="MIDI-signalveien: data fra keyboardet blir lyd først i det virtuelle instrumentet"><figcaption>MIDI-keyboardet sender bare meldinger om hvilke toner som spilles. Det blir lyd først når meldingene når det virtuelle instrumentet.</figcaption><p class="meta"><b>Plassering:</b> Hva skjer når vi spiller på et MIDI-keyboard? · <b>Fil:</b> mp-midi-vei.svg</p></figure><figure><div class="num">10</div><img src="../../images/musikkproduksjon/mp-step.svg" alt="Step sequencer med 16 trinn: stortromme, skarptromme og hi-hat i et enkelt komp"><figcaption>En step sequencer viser én takt som 16 trinn. Hver rad er en MIDI-note som utløser én trommelyd. Her: stortromme på 1 og 3, skarptromme på 2 og 4 og hi-hat på åttendedeler.</figcaption><p class="meta"><b>Plassering:</b> MIDI og trommeprogrammering · <b>Fil:</b> mp-step.svg</p></figure><h2>Spor, looper og redigering <span>node/297</span></h2><figure><div class="num">11</div><img src="../../images/musikkproduksjon/mp-daw.svg" alt="En typisk DAW-arbeidsflate med spor, tidslinje, regioner og avspillingsposisjon"><figcaption>Programmene ser forskjellige ut, men de fleste DAW-er har de samme delene: transport, tidslinje, markører, spor og regioner med lyd eller MIDI.</figcaption><p class="meta"><b>Plassering:</b> Det digitale arbeidsbordet · <b>Fil:</b> mp-daw.svg</p></figure><figure><div class="num">12</div><img src="../../images/musikkproduksjon/mp-looper.svg" alt="Kopiering, looping og repetert avspilling på en tidslinje"><figcaption>Tre arbeidsmåter som ligner på hverandre: kopiering lager nye regioner, looping gjentar det samme materialet, og repetert avspilling spiller et valgt område om og om igjen uten å endre prosjektet.</figcaption><p class="meta"><b>Plassering:</b> Hva er en loop? · <b>Fil:</b> mp-looper.svg</p></figure><figure><div class="num">13</div><img src="../../images/musikkproduksjon/mp-fades.svg" alt="Fade-in, fade-out og crossfade mellom to lydregioner"><figcaption>Den hvite linjen viser nivået. En fade-in øker nivået gradvis, en fade-out senker det. I en crossfade dempes den første regionen mens den andre kommer inn.</figcaption><p class="meta"><b>Plassering:</b> Overganger og crossfades · <b>Fil:</b> mp-fades.svg</p></figure><h2>Introduksjon til miksing <span>node/298</span></h2><figure><div class="num">14</div><img src="../../images/musikkproduksjon/mp-kjede.svg" alt="Forenklet signalvei gjennom en mikserkanal: lydspor, EQ, kompressor, fader, master og lydkort"><figcaption>En forenklet signalvei. Hvert trinn kan endre nivået, så vi følger med på det hele veien – ikke bare på masteren.</figcaption><p class="meta"><b>Plassering:</b> Gain staging – kontroll på signalnivåene (ved eksempelet med pilrekken) · <b>Fil:</b> mp-kjede.svg</p></figure><figure><div class="num">15</div><img src="../../images/musikkproduksjon/mp-stereo.svg" alt="Eksempel på plassering av instrumenter i stereobildet"><figcaption>Et eksempel på plassering i stereobildet: bass, stortromme, skarptromme og vokal i midten, gitarene på hver sin side. Dette er vanlige arbeidsmåter, ikke faste regler.</figcaption><p class="meta"><b>Plassering:</b> Panorering – plassering i stereobildet · <b>Fil:</b> mp-stereo.svg</p></figure><figure><div class="num">16</div><img src="../../images/musikkproduksjon/mp-eq.svg" alt="Fire vanlige EQ-filtre vist som frekvenskurver"><figcaption>Fire vanlige EQ-filtre. Den vannrette linjen er 0 dB, altså ingen endring. Over linjen heves frekvensene, under linjen dempes de.</figcaption><p class="meta"><b>Plassering:</b> Equalizer – kontroll over frekvensene · <b>Fil:</b> mp-eq.svg</p></figure><figure><div class="num">17</div><img src="../../images/musikkproduksjon/mp-kompressor.svg" alt="Kompressorkurve med threshold på −18 dB og ratio 4:1"><figcaption>Under terskelen går signalet uendret gjennom. Over terskelen gir ratio 4:1 omtrent 1 dB økning ut for hver 4 dB inn. Kurven viser full virkning, uten attack og release.</figcaption><p class="meta"><b>Plassering:</b> Kompresjon – kontroll over dynamikken (ved eksempelet med ratio 4:1) · <b>Fil:</b> mp-kompressor.svg</p></figure><figure><div class="num">18</div><img src="../../images/musikkproduksjon/mp-ruting.svg" alt="Ruting: inserts på sporene, send til en felles romklang og trommespor samlet i en buss"><figcaption>Inserts ligger direkte i sporets signalvei. En send fører en andel av signalet til en felles effektkanal, her romklang. Åtte trommespor samles i én buss med felles EQ og kompresjon.</figcaption><p class="meta"><b>Plassering:</b> Insert og send / Grupper og busser · <b>Fil:</b> mp-ruting.svg</p></figure>
</main></body></html>
