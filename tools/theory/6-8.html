<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<title>Takt 6/8</title>
<script src="https://unpkg.com/vexflow@4.2.5/build/cjs/vexflow.js"></script>
<style>
  body { margin:0; background:#fff; }
  #staff { width:100%; max-width:400px; margin:0 auto; }
</style>
</head>
<body>

<div id="staff"></div>

<script>
const VF = Vex.Flow;

const renderer = new VF.Renderer(
  document.getElementById("staff"),
  VF.Renderer.Backends.SVG
);
renderer.resize(400, 160);

const ctx = renderer.getContext();

const stave = new VF.Stave(20, 40, 360);
stave.addClef("treble")
     .addTimeSignature("6/8")
     .setBegBarType(VF.Barline.type.SINGLE)
     .setEndBarType(VF.Barline.type.SINGLE);

stave.setContext(ctx).draw();
</script>

</body>
</html>
