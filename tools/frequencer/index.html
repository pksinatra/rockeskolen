<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frequencer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101112;
      --panel: #181a1d;
      --panel-2: #22252a;
      --text: #f4f0e8;
      --muted: #a9a39a;
      --line: #343841;
      --accent: #61d394;
      --accent-2: #f4b860;
      --danger: #ff6f59;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 30% 0%, rgba(97, 211, 148, 0.18), transparent 34rem),
        linear-gradient(135deg, #101112 0%, #17191c 52%, #0f1415 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 5vw, 4.8rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(24, 26, 29, 0.82);
      color: var(--muted);
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 0 0 rgba(255, 111, 89, 0.45);
    }

    .playing .dot {
      background: var(--accent);
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(97, 211, 148, 0.45); }
      100% { box-shadow: 0 0 0 16px rgba(97, 211, 148, 0); }
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
      gap: 18px;
      align-items: start;
    }

    .surface,
    .side {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(24, 26, 29, 0.9);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.22);
    }

    .surface {
      padding: clamp(18px, 4vw, 34px);
    }

    .readout {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 24px;
    }

    .frequency {
      font-variant-numeric: tabular-nums;
      font-size: clamp(4rem, 12vw, 9.5rem);
      line-height: 0.86;
      letter-spacing: 0;
    }

    .hz {
      color: var(--accent);
      font-size: clamp(1.8rem, 4vw, 3.4rem);
    }

    .note {
      min-width: 110px;
      padding: 14px 16px;
      border-radius: 8px;
      background: var(--panel-2);
      text-align: center;
      font-size: 1.35rem;
      font-weight: 750;
    }

    .visualizer {
      width: 100%;
      height: 170px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0d0f10;
      display: block;
      margin-bottom: 24px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
    }

    label {
      color: var(--muted);
      display: block;
      font-size: 0.88rem;
      margin-bottom: 10px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    input[type="number"],
    select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111315;
      color: var(--text);
      padding: 0 12px;
      font: inherit;
    }

    .number-box {
      width: 132px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      min-height: 52px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #101112;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }

    button.secondary {
      border: 1px solid var(--line);
      background: #111315;
      color: var(--text);
    }

    button:active {
      transform: translateY(1px);
    }

    .side {
      padding: 18px;
    }

    .stack {
      display: grid;
      gap: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .chip {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #121416;
      color: var(--text);
      font-weight: 700;
    }

    .chip.active {
      border-color: var(--accent);
      background: rgba(97, 211, 148, 0.18);
      color: var(--accent);
    }

    .small {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
      margin: 0;
    }

    @media (max-width: 760px) {
      main {
        width: min(100% - 20px, 1120px);
        padding: 18px 0;
      }

      .topbar,
      .layout,
      .readout,
      .control-row {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: stretch;
      }

      .status {
        justify-content: center;
      }

      .note,
      .number-box {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar" id="topbar">
      <h1>Frequencer</h1>
      <div class="status"><span class="dot"></span><span id="stateText">Stopped</span></div>
    </div>

    <div class="layout">
      <section class="surface" aria-label="Frequency generator">
        <div class="readout">
          <div>
            <div class="frequency"><span id="frequencyText">432</span><span class="hz"> Hz</span></div>
          </div>
          <div class="note" id="noteText">A4</div>
        </div>

        <canvas class="visualizer" id="visualizer" width="1200" height="260"></canvas>

        <div class="control-row">
          <div>
            <label for="frequency">Frequency</label>
            <input id="frequency" type="range" min="20" max="2000" step="1" value="432">
          </div>
          <div class="number-box">
            <label for="frequencyNumber">Hz</label>
            <input id="frequencyNumber" type="number" min="20" max="2000" step="1" value="432">
          </div>
        </div>

        <div class="control-row">
          <div>
            <label for="volume">Volume</label>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.18">
          </div>
          <div class="number-box">
            <label for="waveform">Wave</label>
            <select id="waveform">
              <option value="sine">Sine</option>
              <option value="triangle">Triangle</option>
              <option value="square">Square</option>
              <option value="sawtooth">Saw</option>
            </select>
          </div>
        </div>

        <div class="buttons">
          <button id="play">Play</button>
          <button class="secondary" id="stop">Stop</button>
        </div>
      </section>

      <aside class="side">
        <div class="stack">
          <div>
            <label>Presets</label>
            <div class="grid" id="presets">
              <button class="chip" data-frequency="174">174</button>
              <button class="chip" data-frequency="285">285</button>
              <button class="chip" data-frequency="396">396</button>
              <button class="chip" data-frequency="417">417</button>
              <button class="chip active" data-frequency="432">432</button>
              <button class="chip" data-frequency="528">528</button>
              <button class="chip" data-frequency="639">639</button>
              <button class="chip" data-frequency="741">741</button>
              <button class="chip" data-frequency="852">852</button>
            </div>
          </div>

          <div>
            <label>Octave moves</label>
            <div class="buttons">
              <button class="secondary" id="octaveDown">/2</button>
              <button class="secondary" id="octaveUp">x2</button>
            </div>
          </div>

          <p class="small">Tip: If the browser is silent, press Play once. Browsers require a user click before audio can start.</p>
        </div>
      </aside>
    </div>
  </main>

  <script>
    const frequency = document.getElementById("frequency");
    const frequencyNumber = document.getElementById("frequencyNumber");
    const frequencyText = document.getElementById("frequencyText");
    const noteText = document.getElementById("noteText");
    const waveform = document.getElementById("waveform");
    const volume = document.getElementById("volume");
    const play = document.getElementById("play");
    const stop = document.getElementById("stop");
    const topbar = document.getElementById("topbar");
    const stateText = document.getElementById("stateText");
    const canvas = document.getElementById("visualizer");
    const ctx = canvas.getContext("2d");

    let audioContext;
    let oscillator;
    let gain;
    let currentFrequency = 432;

    const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    function frequencyToNote(value) {
      const midi = Math.round(69 + 12 * Math.log2(value / 440));
      const name = noteNames[((midi % 12) + 12) % 12];
      const octave = Math.floor(midi / 12) - 1;
      return `${name}${octave}`;
    }

    function setFrequency(value) {
      const next = Math.max(20, Math.min(2000, Number(value) || 432));
      currentFrequency = next;
      frequency.value = String(next);
      frequencyNumber.value = String(next);
      frequencyText.textContent = String(Math.round(next));
      noteText.textContent = frequencyToNote(next);

      if (oscillator) {
        oscillator.frequency.setTargetAtTime(next, audioContext.currentTime, 0.01);
      }

      document.querySelectorAll(".chip").forEach((chip) => {
        chip.classList.toggle("active", Number(chip.dataset.frequency) === Math.round(next));
      });
    }

    function ensureAudio() {
      if (!audioContext) {
        audioContext = new AudioContext();
        gain = audioContext.createGain();
        gain.gain.value = Number(volume.value);
        gain.connect(audioContext.destination);
      }
    }

    function startTone() {
      ensureAudio();
      if (oscillator) return;

      oscillator = audioContext.createOscillator();
      oscillator.type = waveform.value;
      oscillator.frequency.value = currentFrequency;
      oscillator.connect(gain);
      oscillator.start();
      topbar.classList.add("playing");
      stateText.textContent = "Playing";
    }

    function stopTone() {
      if (!oscillator) return;
      oscillator.stop();
      oscillator.disconnect();
      oscillator = null;
      topbar.classList.remove("playing");
      stateText.textContent = "Stopped";
    }

    function draw() {
      const width = canvas.width;
      const height = canvas.height;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#0d0f10";
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = "rgba(244, 240, 232, 0.12)";
      ctx.lineWidth = 1;
      for (let i = 1; i < 5; i += 1) {
        const y = (height / 5) * i;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      const amplitude = oscillator ? 86 : 36;
      const cycles = Math.max(1, currentFrequency / 90);
      ctx.strokeStyle = oscillator ? "#61d394" : "#f4b860";
      ctx.lineWidth = 5;
      ctx.beginPath();

      for (let x = 0; x <= width; x += 4) {
        const phase = (x / width) * Math.PI * 2 * cycles + performance.now() / 600;
        let y = Math.sin(phase);
        if (waveform.value === "square") y = y >= 0 ? 1 : -1;
        if (waveform.value === "triangle") y = (2 / Math.PI) * Math.asin(Math.sin(phase));
        if (waveform.value === "sawtooth") y = 2 * (phase / (Math.PI * 2) - Math.floor(0.5 + phase / (Math.PI * 2)));
        const point = height / 2 + y * amplitude;
        if (x === 0) ctx.moveTo(x, point);
        else ctx.lineTo(x, point);
      }

      ctx.stroke();
      requestAnimationFrame(draw);
    }

    frequency.addEventListener("input", (event) => setFrequency(event.target.value));
    frequencyNumber.addEventListener("input", (event) => setFrequency(event.target.value));
    waveform.addEventListener("change", () => {
      if (oscillator) oscillator.type = waveform.value;
    });
    volume.addEventListener("input", () => {
      if (gain) gain.gain.setTargetAtTime(Number(volume.value), audioContext.currentTime, 0.01);
    });
    play.addEventListener("click", startTone);
    stop.addEventListener("click", stopTone);
    document.getElementById("octaveDown").addEventListener("click", () => setFrequency(currentFrequency / 2));
    document.getElementById("octaveUp").addEventListener("click", () => setFrequency(currentFrequency * 2));
    document.getElementById("presets").addEventListener("click", (event) => {
      const button = event.target.closest("[data-frequency]");
      if (button) setFrequency(button.dataset.frequency);
    });

    setFrequency(432);
    draw();
  </script>
</body>
</html>
