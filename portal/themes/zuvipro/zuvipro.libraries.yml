# Global stylings. These CSS files will be loaded on every pages.
global-styling:
  version: 11.1.2
  css:
    theme:
      css/tiny-slider.css: {}
      css/style.css: {}
      css/rockeskolen-qa.css: {}

# Global Javascripts. These will be loaded on every pages.
global-scripts:
  version: 11.1.2
  js:
    js/tiny-slider.js: {}
    js/zuvipro.js: {}
  dependencies:
    - core/drupal
    - core/jquery

# Animated content when in view
animated-content:
  version: 11.1.2
  css:
    component:
      css/animate.css: {}

# cookiealert script
cookiealert-scripts:
  version: 1.0
  js:
    js/cookiealert.js: {}

