rockeskolen_structure_qa.article_series:
  path: '/artikkelserie/{taxonomy_term}'
  defaults:
    _controller: '\Drupal\rockeskolen_structure_qa\Controller\ArticleSeriesController::view'
    _title_callback: '\Drupal\rockeskolen_structure_qa\Controller\ArticleSeriesController::title'
  requirements:
    _entity_access: 'taxonomy_term.view'
    taxonomy_term: '\d+'
  options:
    parameters:
      taxonomy_term:
        type: entity:taxonomy_term

rockeskolen_structure_qa.music_practice:
  path: '/musikk-i-praksis'
  defaults:
    _controller: '\Drupal\rockeskolen_structure_qa\Controller\MusicPracticeController::view'
    _title: 'Musikk i praksis'
  requirements:
    _permission: 'access content'

rockeskolen_structure_qa.sitemap:
  path: '/sitemap.xml'
  defaults:
    _controller: '\Drupal\rockeskolen_structure_qa\Controller\SitemapController::view'
  requirements:
    _access: 'TRUE'
